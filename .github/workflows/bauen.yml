# Baut die Website jeden Morgen neu aus dem Projektregister und veröffentlicht sie.
name: Website bauen
on:
  schedule:
    - cron: "0 4 * * *"      # täglich 04:00 UTC
  push:
    branches: [main]
  workflow_dispatch:          # Knopf "Run workflow"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Projektregister holen (nur lesen)
        uses: actions/checkout@v4
        with:
          repository: sowatec-gmbh/wissen-sowatec
          ssh-key: ${{ secrets.WISSEN_LESEN }}
          path: wissen
          sparse-checkout: |
            projekte/000-projektregister.md
            projekte/website-referenzen.md
          sparse-checkout-cone-mode: false
      - name: Seite bauen
        run: python3 bauen.py wissen/projekte/000-projektregister.md _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
